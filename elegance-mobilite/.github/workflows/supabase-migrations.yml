name: 🗄️ Database Migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['supabase/migrations/**']

env:
  SUPABASE_PROJECT_ID: ioddsdzustunlahxafif

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 🚀 Start Supabase Local
        run: supabase start
      - name: ✅ Verify Scripts
        run: |
          chmod +x scripts/*.sh
          ./scripts/verify-setup.sh || true
          ./scripts/verify-vtc-compliance.sh

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🚀 Push Migrations
        run: |
          # La CLI utilise automatiquement SUPABASE_DB_PASSWORD s'il est en ENV
          supabase db push --project-ref $SUPABASE_PROJECT_ID
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 📊 Status
        run: supabase migration list --project-ref $SUPABASE_PROJECT_ID
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
