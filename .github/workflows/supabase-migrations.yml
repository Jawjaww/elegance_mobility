name: 🗄️ Database Migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['supabase/migrations/**']

env:
  SUPABASE_PROJECT_ID: ioddsdzustunlahxafif

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🚀 Start Supabase Local
        run: supabase start

      - name: ✅ Verify Scripts
        run: |
          chmod +x scripts/*.sh
          ./scripts/verify-setup.sh || true
          ./scripts/verify-vtc-compliance.sh

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🔎 Verify required secrets exist
        id: check-secrets
        run: |
          missing=false
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "Missing secret: SUPABASE_ACCESS_TOKEN"
            missing=true
          fi
          if [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "Missing secret: SUPABASE_DB_PASSWORD"
            missing=true
          fi
          if [ "$missing" = "true" ]; then
            echo "One or more required secrets are missing. Exiting."
            exit 1
          fi

      - name: 💾 Backup DB (pg_dump)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          echo "Creating DB backup (pg_dump) to artifact..."
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          BACKUP_FILE="db-backup-${TIMESTAMP}.sql.gz"
          pg_dump -h db.${{ env.SUPABASE_PROJECT_ID }}.supabase.co -p 5432 -U postgres postgres | gzip -c > "${BACKUP_FILE}"
          echo "Backup created: ${BACKUP_FILE}"
          mkdir -p backup_artifact
          mv "${BACKUP_FILE}" backup_artifact/
          echo "backup_file=${BACKUP_FILE}" >> $GITHUB_OUTPUT

      - name: 📦 Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup_artifact/

      - name: 🔗 Link Supabase Project
        run: supabase link --project-ref "${{ env.SUPABASE_PROJECT_ID }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: 🚀 Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --project-ref "${{ env.SUPABASE_PROJECT_ID }}"

      - name: 📊 Migration Status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --project-ref "${{ env.SUPABASE_PROJECT_ID }}"

      - name: 🔔 Notify Success
        if: success()
        run: |
          echo "✅ Migrations déployées avec succès sur Supabase"
          echo "🔗 Projet : https://supabase.com/dashboard/project/${{ env.SUPABASE_PROJECT_ID }}"

      - name: 🔔 Notify Failure
        if: failure()
        run: |
          echo "❌ Échec du déploiement des migrations"
          echo "Vérifiez les logs ci-dessus"
