name: 🔍 Supabase Lint

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🚀 Start Supabase Local
        run: |
          cd elegance-mobilite
          supabase start

      - name: 🔍 Check RLS Enabled
        run: |
          echo "🔒 Vérification du RLS sur les tables critiques..."
          RESULT=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -tAc "
            SELECT COUNT(*) 
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
            AND c.relname IN ('vehicles', 'drivers', 'rides', 'driver_documents', 'vehicle_documents', 'user_profiles')
            AND c.relrowsecurity = false
            AND c.relkind = 'r';
          ")
          if [ "$RESULT" -eq "0" ]; then
            echo "✅ RLS activé sur toutes les tables critiques"
          else
            echo "❌ $RESULT table(s) sans RLS détectée(s)"
            exit 1
          fi

      - name: 🔍 Check Search Path
        run: |
          echo "🔧 Vérification du search_path des fonctions..."
          RESULT=$(PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -tAc "
            SELECT COUNT(*) 
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
            AND p.prosecdef = true
            AND (p.proconfig IS NULL OR array_length(p.proconfig, 1) IS NULL)
            AND p.proname IN ('is_admin', 'is_super_admin', 'assign_user_role_on_signup', 'create_pending_driver');
          ")
          if [ "$RESULT" -eq "0" ]; then
            echo "✅ Fonctions SECURITY DEFINER avec search_path configuré"
          else
            echo "❌ $RESULT fonction(s) SECURITY DEFINER sans search_path"
            exit 1
          fi

      - name: 📋 Migration Naming Convention
        run: |
          echo "📁 Vérification de la convention de nommage..."
          cd elegance-mobilite
          for file in supabase/migrations/*.sql; do
            filename=$(basename "$file")
            if [[ ! $filename =~ ^[0-9]{14,}_.*\.sql$ ]]; then
              echo "❌ Nom invalide : $filename"
              echo "   Format attendu : YYYYMMDDHHMMSS_description.sql"
              exit 1
            fi
          done
          echo "✅ Convention de nommage respectée"

      - name: ✅ All Checks Passed
        if: success()
        run: echo "🎉 Toutes les vérifications ont réussi !"
